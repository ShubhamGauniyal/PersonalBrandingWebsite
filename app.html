<!DOCTYPE html>
<html>
<head>
  <title>Open App</title>

  <script>
    const androidUrl =
      "https://play.google.com/store/apps/details?id=com.app.dailymotorwash";

    const iosUrl =
      "https://apps.apple.com/in/app/dmw-daily-motor-wash/id6764251896";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      window.location.href = androidUrl;
    }
    else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.href = iosUrl;
    }
    else {
      // Optional fallback
      window.location.href = "https://dailymotorwash.com";
    }
  </script>
</head>

  Redirecting...
</body>
</html>
